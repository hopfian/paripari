name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # NOTE: CI is deliberately fully OFFLINE — it never contacts crunchyroll.com.
      # Live verification is a manual, documented step (docs/REPRODUCING.md).

      - name: Decompress every census
        run: |
          gzip -dk census/2026.10-BD/census-2026.10-BD.full.json.gz
          gzip -dk census/2026.10-US/census-2026.10-US.full.json.gz

      - name: Validate all census artifacts (JSON + manifest checksums + self-consistency + syntax)
        run: |
          python3 tools/validate.py --release 2026.10-BD
          python3 tools/validate.py --release 2026.10-US

      - name: Token-hygiene check on provenance bundles
        run: make sanitize-check
